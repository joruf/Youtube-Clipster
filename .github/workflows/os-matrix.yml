name: OS Matrix

# On-demand multi-OS checks for local matrix tooling (os-test-matrix).
on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: "contract = unit contract tests; full = contract + run.py --check"
        type: choice
        options:
          - contract
          - full
        default: contract
      runner_os:
        description: "GitHub-hosted runner OS"
        type: choice
        options:
          - windows-latest
          - ubuntu-22.04
          - ubuntu-24.04
        default: windows-latest
      python_version:
        description: "Python version"
        type: choice
        options:
          - "3.12"
          - "3.11"
          - "3.10"
        default: "3.12"

permissions:
  contents: read

jobs:
  test:
    name: ${{ inputs.test_mode }} on ${{ inputs.runner_os }} (py${{ inputs.python_version }})
    runs-on: ${{ inputs.runner_os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk ffmpeg xclip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run contract tests
        run: |
          python -m unittest tests.test_cross_platform_contract -v

      - name: Run dependency check (full mode)
        if: inputs.test_mode == 'full'
        env:
          YOUTUBE_CLIPSTER_HOME: ${{ runner.temp }}/youtube-clipster-home
        run: |
          python run.py --check --no-auto-install
