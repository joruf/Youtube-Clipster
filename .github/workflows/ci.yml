name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb ffmpeg xclip

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run cross-platform contract tests
        run: |
          python -m unittest tests.test_cross_platform_contract -v

      # unittest discovery only ever collected the TestCase based contract
      # module: everything else in tests/ is written for pytest and was silently
      # skipped. Run the real suite instead, with a display where there is one.
      - name: Run full test suite (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q

      - name: Run full test suite (Windows, no desktop session)
        if: runner.os == 'Windows'
        run: python -m pytest -q -m "not gui"
