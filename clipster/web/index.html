<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#15161a">
<title>YouTube Clipster</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/icon.png">
<!-- use-credentials: a manifest is fetched without cookies by default, so the
     token would not travel and the token-protected server would answer 401 -
     which silently makes the page uninstallable and kills the share target. -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clipster">
</head>
<body>

<header class="bar">
    <img class="logo" src="/icon.png" alt="">
    <h1>YouTube Clipster</h1>
    <span id="connection" class="dot" title="Connection"></span>
</header>

<nav class="tabs" role="tablist">
    <button id="tab-downloads" class="tab selected" type="button" role="tab">Downloads</button>
    <button id="tab-streaming" class="tab" type="button" role="tab">Streaming</button>
</nav>

<main id="view-downloads">
    <form id="submit-form" class="card">
        <label class="label" for="url">YouTube link</label>
        <input id="url" name="url" type="url" inputmode="url" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="https://youtu.be/...">
        <div class="row">
            <div class="formats" role="radiogroup" aria-label="Format">
                <label class="chip">
                    <input type="radio" name="format" value="mp3" checked>
                    <span>MP3</span>
                </label>
                <label class="chip">
                    <input type="radio" name="format" value="mp4">
                    <span>MP4</span>
                </label>
            </div>
            <button id="send" type="submit" class="primary">Download</button>
        </div>
        <p id="message" class="message" hidden></p>
    </form>

    <section id="running" class="card" hidden>
        <h2>Running</h2>
        <ul id="active" class="active"></ul>
    </section>

    <section class="card">
        <div class="row between">
            <h2>Downloads</h2>
            <button id="refresh" type="button" class="quiet">Refresh</button>
        </div>
        <ul id="downloads" class="downloads"></ul>
        <p id="empty" class="message" hidden>Nothing here yet.</p>
    </section>
</main>

<main id="view-streaming" hidden>
    <section class="card">
        <div class="row between">
            <label class="label" for="search">Search YouTube</label>
            <button id="results-toggle" type="button" class="quiet" hidden
                    aria-expanded="true" aria-controls="results">▲ Hide</button>
        </div>
        <input id="search" type="search" inputmode="search" autocomplete="off"
               autocapitalize="off" spellcheck="false" placeholder="Artist, song, anything">
        <p id="search-note" class="meta"></p>
        <ul id="results" class="downloads"></ul>
    </section>

    <section class="card">
        <h2>Play on</h2>
        <div class="formats" role="radiogroup" aria-label="Playback target">
            <label class="chip">
                <input type="radio" name="target" value="host" checked>
                <span>The PC</span>
            </label>
            <label class="chip">
                <input type="radio" name="target" value="guest">
                <span>This device</span>
            </label>
        </div>
        <p id="target-note" class="meta"></p>
        <div class="row" id="volume-row">
            <span class="meta" id="volume-label">Volume</span>
            <input id="volume" type="range" min="0" max="100" step="1" value="70"
                   aria-label="Volume">
            <span class="meta" id="volume-value">70</span>
        </div>
    </section>

    <section class="card" id="now-playing">
        <h2>Now playing</h2>
        <p id="stream-title" class="stream-title">Nothing yet.</p>
        <p id="stream-uploader" class="meta"></p>
        <div class="track" id="stream-track">
            <div class="fill" id="stream-fill"></div>
        </div>
        <p class="meta" id="stream-time">–:– / –:–</p>
        <div class="level" aria-hidden="true"><div class="level-fill" id="stream-level"></div></div>
        <div class="transport">
            <button id="stream-previous" class="icon" type="button" aria-label="Previous">⏮</button>
            <button id="stream-toggle" class="primary" type="button" aria-label="Play or pause">▶</button>
            <button id="stream-next" class="icon" type="button" aria-label="Next">⏭</button>
            <button id="stream-like" class="icon" type="button" aria-label="Like">👍</button>
            <button id="stream-dislike" class="icon" type="button" aria-label="Dislike">👎</button>
            <button id="stream-download" class="icon" type="button" aria-label="Download">⤓</button>
        </div>
        <p id="stream-message" class="message" hidden></p>
    </section>

    <section class="card">
        <div class="row between">
            <h2>Queue</h2>
            <button id="stream-refresh" type="button" class="quiet">Find similar</button>
        </div>
        <ul id="queue" class="downloads"></ul>
        <p id="queue-empty" class="message" hidden>No songs yet — tap Find similar.</p>
    </section>
</main>

<audio id="player" controls hidden preload="none"></audio>

<script src="/app.js"></script>
</body>
</html>
